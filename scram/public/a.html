<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Argon | Orbit AI</title><link rel="shortcut icon" href="favicon.ico"><link rel="stylesheet" href="index.css"><style>.argon{max-width:900px;margin:0 auto;padding:70px 28px 80px}.argon-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:45px}.argon h1{font:400 clamp(48px,8vw,82px)/.95 Georgia,serif;letter-spacing:-.06em;margin:0}.argon h1 em{font-style:normal;color:var(--accent)}.argon-intro{max-width:280px;color:var(--muted);font-size:13px;line-height:1.6}.chat{border:1px solid var(--line);background:var(--panel);min-height:410px;display:flex;flex-direction:column}.messages{flex:1;padding:25px}.message{max-width:75%;padding:14px 16px;margin-bottom:12px;font-size:13px;line-height:1.6;border:1px solid var(--line)}.message.argon{background:color-mix(in srgb,var(--accent) 10%,transparent)}.message.user{margin-left:auto;background:var(--bg);color:var(--ink)}.chat-form{display:flex;gap:8px;padding:13px;border-top:1px solid var(--line)}.chat-form input{min-width:0;flex:1;padding:12px 14px;background:var(--bg);border:1px solid var(--line);color:var(--ink);outline:0}.chat-form button{padding:0 17px;background:var(--accent);border:0;color:var(--bg);font-weight:700;cursor:pointer}.argon-foot{display:flex;justify-content:space-between;margin-top:22px;font-size:11px}.argon-foot a{color:var(--muted);text-decoration:none}@media(max-width:600px){.argon{padding:45px 20px}.argon-head{align-items:start;flex-direction:column}.message{max-width:90%}}
</style></head>
<body><header class="topbar"><a class="brand" href="index.html"><span class="black-hole"><i></i></span><span>orbit</span></a><nav class="nav-links"><a href="g.html">Arcade</a><button class="icon-button" id="argonTheme" type="button" title="Cycle theme" aria-label="Cycle theme">&#9788;</button></nav></header><main class="argon"><div class="argon-head"><div><p class="eyebrow">02 / Think</p><h1>Meet <em>Argon.</em></h1></div><p class="argon-intro">A small, calm thinking companion. This local demo answers common prompts without pretending to be a cloud model.</p></div><section class="chat"><div class="messages" id="messages"><div class="message argon">Hi. I’m Argon. Give me a question, a rough idea, or a task to untangle.</div></div><form class="chat-form" id="chatForm"><input id="chatInput" autocomplete="off" placeholder="Ask Argon something..."><button type="submit">Send</button></form></section><div class="argon-foot"><a href="index.html">&#8592; Back to Orbit</a><span>Local interface / no account required</span></div></main><script>const messages=document.getElementById('messages'),input=document.getElementById('chatInput');const answers=[['hello|hi|hey','Hello. What are we making sense of?'],['theme|color|style','Try the settings on Orbit home. Minecraft, Midnight, Paper, Copper, and Aurora are waiting there.'],['orbit|proxy|browse','Use the address bar on home. I’ll stay here and help you think while Orbit handles the route.'],['help|what can you do|task','I can help break a task into steps, draft a starting point, or turn a fuzzy idea into a clear question.']];function reply(text){const lower=text.toLowerCase();const found=answers.find(([keys])=>keys.split('|').some(key=>lower.includes(key)));return found?found[1]:`That’s a good one to sit with: “${text}”. Start by naming the outcome you want, then we can work backward from there.`}document.getElementById('chatForm').addEventListener('submit',event=>{event.preventDefault();const text=input.value.trim();if(!text)return;messages.insertAdjacentHTML('beforeend',`<div class="message user"></div>`);messages.lastElementChild.textContent=text;messages.insertAdjacentHTML('beforeend',`<div class="message argon"></div>`);messages.lastElementChild.textContent=reply(text);input.value='';messages.scrollTop=messages.scrollHeight});const themes=['aurora','midnight','minecraft','paper','copper'];document.documentElement.dataset.theme=localStorage.getItem('orbit_theme')||'aurora';document.getElementById('argonTheme').addEventListener('click',()=>{const current=themes.indexOf(document.documentElement.dataset.theme),next=themes[(current+1)%themes.length];document.documentElement.dataset.theme=next;localStorage.setItem('orbit_theme',next)});</script></body></html>
