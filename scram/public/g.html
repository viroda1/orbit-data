<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Orbit Arcade</title>
	<link rel="icon" type="image/svg+xml" href="orbit.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		*{box-sizing:border-box}html{--bg:#07111f;--bg2:#0d2031;--accent:#74c7e8;--accent2:#99dfc1;--text:#eaf2f8;--muted:#8393a2;--surface:rgba(255,255,255,.06);--surface2:rgba(255,255,255,.1);--line:rgba(197,220,235,.14);--radius:14px}html[data-theme="midnight"]{--bg:#0d0b1b;--bg2:#191532;--accent:#a99cff;--accent2:#c2b8ff;--text:#f1edff;--muted:#9d95b9;--surface:rgba(169,156,255,.07);--surface2:rgba(169,156,255,.13);--line:rgba(169,156,255,.2)}html[data-theme="minecraft"]{--bg:#14180e;--bg2:#222b16;--accent:#7cb342;--accent2:#d6e879;--text:#edf6d4;--muted:#a5b886;--surface:rgba(124,179,66,.08);--surface2:rgba(124,179,66,.15);--line:rgba(177,219,102,.2)}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 80% 0%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 35%),linear-gradient(145deg,var(--bg),var(--bg2));color:var(--text);font-family:Inter,system-ui,sans-serif;padding:24px;transition:background .3s,color .3s}.shell{max-width:1180px;margin:0 auto}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(18px);box-shadow:0 20px 50px #0004}.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--bg);font-family:Orbitron,sans-serif;font-weight:800}.brand-text{font-family:Orbitron,sans-serif;font-size:19px;font-weight:800;letter-spacing:.04em}.brand-text span{color:var(--muted);font-family:Inter,sans-serif;font-size:13px;font-weight:500}.header-actions{display:flex;gap:8px}.icon-button,.button{border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);cursor:pointer}.icon-button{width:40px;height:40px;font-size:18px}.icon-button:hover,.button:hover{background:var(--accent);border-color:var(--accent);color:var(--bg)}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 20px}.search-wrap{position:relative;flex:1 1 280px}.search-wrap span{position:absolute;left:15px;top:12px;color:var(--muted)}.controls input,.controls select{width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);outline:0}.controls input{padding-left:40px}.controls input:focus,.controls select:focus{border-color:var(--accent)}.controls select{flex:0 1 190px}.controls option{background:var(--bg2);color:var(--text)}.hero{display:flex;justify-content:space-between;align-items:end;gap:25px;margin:52px 0 30px}.eyebrow{color:var(--accent2);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px}.hero h1{font-family:Orbitron,sans-serif;font-size:clamp(35px,6vw,68px);line-height:1;margin:0}.hero h1 span{color:var(--accent)}.hero p:last-child{max-width:310px;color:var(--muted);font-size:13px;line-height:1.6;margin:0}.count{color:var(--muted);font-size:12px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:15px}.card{position:relative;overflow:hidden;min-height:205px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer;opacity:0;animation:pop .45s ease forwards;transition:transform .2s,border-color .2s,box-shadow .2s}.card:hover{transform:translateY(-6px) scale(1.02);border-color:var(--accent);box-shadow:0 16px 35px color-mix(in srgb,var(--accent) 20%,transparent)}.card-art{height:155px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,transparent),var(--surface));font-family:Orbitron,sans-serif;font-size:42px;color:var(--accent)}.card-name{display:block;padding:14px 12px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-tag{position:absolute;top:10px;right:10px;padding:4px 7px;border-radius:99px;background:#0008;color:var(--muted);font-size:9px;text-transform:uppercase}.empty{grid-column:1/-1;padding:65px;text-align:center;color:var(--muted)}@keyframes pop{to{opacity:1;transform:translateY(0)}}.back{display:inline-block;margin-top:36px;color:var(--muted);font-size:12px;text-decoration:none}.back:hover{color:var(--accent)}.overlay{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:20px;background:#000d;backdrop-filter:blur(12px)}.modal{width:min(1200px,100%);height:min(86vh,800px);display:flex;flex-direction:column;overflow:hidden;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 30px 90px #000b}.modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.modal-title{flex:1;font-family:Orbitron,sans-serif;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame{width:100%;flex:1;border:0;background:#000}.settings{width:min(440px,100%);height:auto;padding:24px}.settings h2{font-family:Orbitron,sans-serif;font-size:20px;margin:0 0 22px}.settings label{display:block;margin:16px 0 7px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.settings select,.settings input{width:100%;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text)}.settings option{background:var(--bg2)}.setting-actions{display:flex;justify-content:flex-end;margin-top:24px}.button{padding:10px 15px;font-weight:600}.notice{color:var(--muted);font-size:12px;line-height:1.5;margin:18px 0 0}@media(max-width:600px){body{padding:14px}.hero{align-items:start;flex-direction:column}.hero p:last-child{max-width:100%}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{min-height:175px}.card-art{height:125px}.controls select{flex:1 1 145px}}
	.brand-mark{font-family:Inter,"Segoe UI",sans-serif;font-weight:800;color:var(--accent);background:transparent;border:1px solid var(--accent)}
	</style>
</head>
<body>
	<main class="shell">
		<header class="header"><a class="brand" href="index.html"><span class="brand-mark">O</span><span class="brand-text">orbit<span>.arcade</span></span></a><div class="header-actions"><button class="icon-button" id="themeButton" title="Cycle theme" aria-label="Cycle theme">&#9788;</button><button class="icon-button" id="settingsButton" title="Settings" aria-label="Settings">&#9881;</button></div></header>
		<section class="hero"><div><p class="eyebrow">Orbit arcade</p><h1>Pick a game.<br><span>Make it yours.</span></h1></div><p>A playful game deck with the expressive themes and quick controls from Lithium.SH, launched through Orbit.</p></section>
		<section class="controls"><div class="search-wrap"><span>&#9906;</span><input id="searchBar" type="search" placeholder="Search games..." autocomplete="off"></div><select id="providerSelect" aria-label="Game source"><option value="featured">Featured</option><option value="gn-math">GN-Math</option></select></section>
		<div class="count" id="count"></div><section class="grid" id="container"></section><a class="back" href="index.html">&#8592; Back to Orbit</a>
	</main>
	<div class="overlay" id="gameOverlay"><div class="modal"><div class="modal-head"><span class="modal-title" id="gameTitle"></span><button class="icon-button" id="fullscreenButton" title="Fullscreen" aria-label="Fullscreen">&#9974;</button><button class="icon-button" id="closeButton" title="Close" aria-label="Close">&times;</button></div><iframe class="frame" id="gameFrame" allow="fullscreen; autoplay" allowfullscreen></iframe></div></div>
	<div class="overlay" id="settingsOverlay"><div class="modal settings"><h2>Orbit settings</h2><label for="themeSelect">Theme</label><select id="themeSelect"><option value="aurora">Aurora</option><option value="midnight">Midnight</option><option value="minecraft">Minecraft</option></select><label for="accentInput">Custom accent</label><input id="accentInput" type="color" value="#74c7e8"><p class="notice">Themes change the full interface palette, including text, surfaces, borders, and accents.</p><div class="setting-actions"><button class="button" id="closeSettings">Done</button></div></div></div>
	<script>
		const games=[{name:'2048',tag:'Puzzle',url:'https://play2048.co/',mark:'2'},{name:'TETR.IO',tag:'Arcade',url:'https://tetr.io/',mark:'T'},{name:'Agar.io',tag:'Action',url:'https://agar.io/',mark:'A'},{name:'Diep.io',tag:'Action',url:'https://diep.io/',mark:'D'},{name:'Slither.io',tag:'Arcade',url:'https://slither.io/',mark:'S'},{name:'Shell Shockers',tag:'Shooter',url:'https://shellshock.io/',mark:'S'},{name:'Krunker',tag:'Shooter',url:'https://krunker.io/',mark:'K'},{name:'Chess',tag:'Strategy',url:'https://chess.org/',mark:'C'}];
		const root=document.documentElement, container=document.getElementById('container'), search=document.getElementById('searchBar'), count=document.getElementById('count'), gameOverlay=document.getElementById('gameOverlay'), frame=document.getElementById('gameFrame'), title=document.getElementById('gameTitle');
		const palettes={aurora:{bg:'#07111f',bg2:'#0d2031',accent:'#74c7e8',accent2:'#99dfc1',text:'#eaf2f8',muted:'#8393a2'},midnight:{bg:'#0d0b1b',bg2:'#191532',accent:'#a99cff',accent2:'#c2b8ff',text:'#f1edff',muted:'#9d95b9'},minecraft:{bg:'#14180e',bg2:'#222b16',accent:'#7cb342',accent2:'#d6e879',text:'#edf6d4',muted:'#a5b886'}};
		function setTheme(name){const p=palettes[name]||palettes.aurora;Object.entries(p).forEach(([k,v])=>root.style.setProperty('--'+k,v));localStorage.setItem('orbit_theme',name);document.getElementById('themeSelect').value=name;}
		function render(){const q=search.value.toLowerCase();const list=games.filter(g=>g.name.toLowerCase().includes(q)||g.tag.toLowerCase().includes(q));count.textContent=list.length+' games';container.innerHTML=list.length?list.map((g,i)=>`<article class="card" style="animation-delay:${Math.min(i*.035,.8)}s" data-url="${g.url}" data-name="${g.name}"><div class="card-art">${g.mark}</div><span class="card-tag">${g.tag}</span><span class="card-name">${g.name}</span></article>`).join(''):'<div class="empty">No games found.</div>';container.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{title.textContent=card.dataset.name;frame.src=card.dataset.url;gameOverlay.style.display='grid';}));}
		search.addEventListener('input',render);document.getElementById('closeButton').addEventListener('click',()=>{gameOverlay.style.display='none';frame.src='';});gameOverlay.addEventListener('click',e=>{if(e.target===gameOverlay)document.getElementById('closeButton').click();});document.getElementById('fullscreenButton').addEventListener('click',()=>frame.requestFullscreen().catch(()=>{}));
		const settings=document.getElementById('settingsOverlay');document.getElementById('settingsButton').addEventListener('click',()=>settings.style.display='grid');document.getElementById('closeSettings').addEventListener('click',()=>settings.style.display='none');settings.addEventListener('click',e=>{if(e.target===settings)settings.style.display='none'});document.getElementById('themeSelect').addEventListener('change',e=>setTheme(e.target.value));document.getElementById('accentInput').addEventListener('input',e=>{root.style.setProperty('--accent',e.target.value);localStorage.setItem('orbit_accent',e.target.value)});document.getElementById('themeButton').addEventListener('click',()=>{const names=Object.keys(palettes),next=names[(names.indexOf(localStorage.getItem('orbit_theme')||'aurora')+1)%names.length];setTheme(next)});
		setTheme(localStorage.getItem('orbit_theme')||'aurora');if(localStorage.getItem('orbit_accent'))root.style.setProperty('--accent',localStorage.getItem('orbit_accent'));render();
	</script>
</body>
</html>
